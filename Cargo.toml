[workspace]
members = ["session"]
resolver = "3"

# セッションの wasm をビルドする設定. ページが読む量を減らすため, 速さより小ささを優先する.
# release とは分けておき, 後で足すクレート (シェル等) の release には効かせない.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# 名前等の節は wasm-opt が消す. ここで消すと使う機能を書いた節も消え, wasm-opt がそれを読めなくなる.
strip = false
