[package]
name = "silica-session"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# cdylib はページが読む wasm (後でシェルが読む共有ライブラリも), rlib は cargo test のため.
crate-type = ["cdylib", "rlib"]

[dependencies]
prost = { version = "0.14", default-features = false, features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
talc = "5.1.1"

[dev-dependencies]
pbjson = "0.8"
serde = "1"
serde_json = "1"

[build-dependencies]
pbjson-build = "0.8"
prost-build = "0.14"
protox = "0.9"
