# PR ごとに, 型検査, lint, テスト, ビルド (silica, セッションの wasm, サンプル) と, セッションの大きさの計測を回す.
# OS ごとに違うコードは無いので, Linux の1か所で回す.
name: CI

on:
  pull_request:

permissions:
  contents: read

# 同じ PR に続けて push したら, 古い方の実行は止める.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # PR の画面と Ruleset に出る確認の名前.
    name: check
    runs-on: ubuntu-latest
    # 止まらなくなった時に, 既定の6時間まで走らせ続けないようにする.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm のバージョンは package.json の packageManager から読む.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version # yamaoki-lint:ignore
      - run: pnpm install --frozen-lockfile
      # Rust のバージョン, ターゲット, コンポーネントは rust-toolchain.toml から読む. rustup は GitHub の環境に入っている.
      - run: rustup toolchain install
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec buf lint
      - run: cargo fmt --check
      # セッションは手元 (テスト) と wasm の両方でビルドするので, clippy も両方にかける.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
      - run: pnpm test
      - run: pnpm build
      # サイズ上限を超えたら落とす. 値はジョブの要約にも出す.
      - run: pnpm check:size
      # 使う側と同じく, パッケージ (tgz) から入れた silica でサンプルをビルドする.
      # パッケージに入れ忘れたファイルや, node_modules の中に置いた時だけ起きる壊れ方を見つける.
      # silica の依存を解決するメタデータは, キャッシュが無い PR の最初の回には手元に無いので, --prefer-offline で足りない分だけ取りに行く.
      - name: build (example)
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          pnpm --filter silica-example add "silica@file:$(echo "$RUNNER_TEMP"/pack/silica-*.tgz)" --prefer-offline
          pnpm --filter silica-example build
