# PR ごとに, 型検査, lint, テスト, 組み立て (silica と見本) を回す.
# OS ごとに違うコードは無いので, Linux の1か所で回す.
name: CI

on:
  pull_request:

permissions:
  contents: read

# 同じ PR に続けて push したら, 古い方の実行は止める.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # PR の画面と Ruleset に出る確認の名前.
    name: check
    runs-on: ubuntu-latest
    # 止まらなくなった時に, 既定の6時間まで走らせ続けないようにする.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm のバージョンは package.json の packageManager から読む.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version # yamaoki-lint:ignore
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: build (example)
        run: pnpm --filter silica-example build
