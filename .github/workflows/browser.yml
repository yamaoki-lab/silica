# すべての PR で Playwright を使ってブラウザテスト (*.browser.test.ts) を実行する (#20).
# Chromium, Firefox, および WebKit はすべて, セッションの wasm 用の Rust と日本語の Hiragino フォントがある macOS 上で動かす.
# ブランチ上で手動 (workflow_dispatch) で実行すると, 基準画像を撮り直し, 変更されたものだけを artifact としてアップロードする.
# これらは手動でコミットする. デフォルトのトークンを使った CI からのプッシュでは CI が再起動せず, 必須チェックが走らないため.
name: browser

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ PR に続けて push したら, 古い方の実行は止める.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    # PR の画面と Ruleset に出る確認の名前.
    name: browser
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version # yamaoki-lint:ignore
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      # セッションの wasm は Rust のコード, .proto ファイル, およびビルド設定が変わった時だけ変化するため, それらをもとにキャッシュする.
      # キャッシュがヒットした場合は Rust は不要.
      - id: wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/session/session.wasm
          key: session-wasm-${{ hashFiles('session/**', 'proto/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'scripts/build-wasm.ts', 'pnpm-lock.yaml') }}
      - if: steps.wasm.outputs.cache-hit != 'true'
        run: rustup toolchain install && pnpm build:wasm
      # ブラウザは Playwright のバージョンごとにキャッシュする.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-macos-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install chromium firefox webkit
      # 日本語の Hiragino フォントのファイル名は NFD になっているため, 検索する前に変換する. 1 つも見つからない場合は失敗させる.
      - run: ls /System/Library/Fonts | iconv -f UTF-8-MAC -t UTF-8 | grep -E 'Hiragino|ヒラギノ'
      - run: pnpm exec vitest run --project=chromium --project=firefox --project=webkit ${{ github.event_name == 'workflow_dispatch' && '--update' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fonts
          path: test-results/fonts
          retention-days: 1
          if-no-files-found: ignore
      # 手動で実行した時は, 変更または追加された基準画像だけを, パスを保ったまま収集する.
      - if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p test-results/references
          git ls-files --modified --others --exclude-standard -- ':(glob)src/**/__screenshots__/**' | tar -cf - -T - | tar -xf - -C test-results/references
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: references
          path: test-results/references
          retention-days: 1
          if-no-files-found: ignore
