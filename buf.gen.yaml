# .proto から TS の型を作る (pnpm gen). 生成したものはリポジトリに入れない.
version: v2
clean: true
plugins:
  # ページが読む方. JSON の処理は使わないので出さない.
  - local: protoc-gen-ts_proto
    out: src/session/gen
    opt:
      - oneof=unions-value
      - outputJsonMethods=false
      - outputPartialMethods=false
      - useExactTypes=false
      - enumsAsLiterals=true
      - importSuffix=.ts
  # テストでシナリオの JSON を読む方. ページが読む方と同じ型に, JSON の処理を足したもの.
  - local: protoc-gen-ts_proto
    out: src/session/gen-json
    opt:
      - oneof=unions-value
      - outputPartialMethods=false
      - useExactTypes=false
      - enumsAsLiterals=true
      - importSuffix=.ts
